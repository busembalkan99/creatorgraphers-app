  <body>
    <script>
      // Kabuk yuksekligi. iOS'ta tek bir birim iki modda birden dogru degil:
      // Safari sekmesinde 100vh adres cubugu kadar fazla uzun, ana ekrana eklenen
      // uygulamada ise dvh'nin soguk acilista yanlis degerle basladigi bildiriliyor.
      // window.innerHeight ikisinde de o an gorunen yuksekligi veriyor.
      (function () {
        var kok = document.documentElement;
        function ekran() { kok.style.setProperty('--ekran', window.innerHeight + 'px'); }
        ekran();
        addEventListener('resize', ekran);
        addEventListener('orientationchange', function () { setTimeout(ekran, 200); });
        if (window.visualViewport) visualViewport.addEventListener('resize', ekran);
        // iOS Safari, sayfada dokunma dinleyicisi yoksa :active stilini hiç uygulamıyor;
        // basınca küçülme telefonda görünmezdi. Boş bir dinleyici yetiyor.
        document.addEventListener('touchstart', function () {}, { passive: true });
        // Sayfa yakınlaştırması kapalı. iOS Safari viewport'taki user-scalable=no'yu yok
        // sayıyor, iki parmak jestini ancak bu olayı durdurarak engelliyoruz. Fotoğraf
        // büyüteci jesti kendisi sayıyor (pointer olayları), bundan etkilenmiyor.
        function durdur(e) { e.preventDefault(); }
        document.addEventListener('gesturestart', durdur, { passive: false });
        document.addEventListener('gesturechange', durdur, { passive: false });
      })();
    </script>
    <div id="root"></div>
  </body>
